<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="registrar.css">
</head>
<body>
    <div class="page-container">
        
        <div class="banner-side"></div>

        <main>
            
            <form>
                
                <button type="button" class="btn-back" onclick="window.history.back()">
                    <svg viewBox="0 0 24 24">
                        <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
                    </svg>
                    Voltar
                </button>

                <div class="brand-header">
                    <svg class="prodesp-icon" viewBox="0 0 100 115" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="22" r="18" />
                        <line x1="50" y1="22" x2="78" y2="58" stroke-width="10" stroke="#4c2582" />
                        <circle cx="78" cy="58" r="18" />
                        <line x1="78" y1="58" x2="32" y2="92" stroke-width="10" stroke="#4c2582" />
                        <circle cx="32" cy="92" r="18" />
                    </svg>
                    <div class="prodesp-text">Prodesp</div>
                </div>

                <h1>Acesso ao Sistema</h1>
                
                <div class="input-group">
                    <label for="username">Usuário:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                                
                <div class="input-group">
                    <label for="confirm-password">Confirmar Senha:</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>

                <button id='Envia' type="submit">Entrar</button>

                <div class="form-footer-links">
                    <span style="color: #777;">Já tem uma conta? </span> <a href="../login/login.html">Login</a>
                </div>
            </form>
        </main>
    </div>
</body>
<script type="module" src="../api/mandapi.js"></script>
</html>
